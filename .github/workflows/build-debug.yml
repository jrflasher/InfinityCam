name: Build Debug APK

# Local Gradle is blocked in this VM (daemon talks over localhost TCP,
# runtime intercepts it). Build in GitHub Actions instead.
# Trigger manually: Actions > Build Debug APK > Run workflow.
# No keystore secret needed — debug builds use the fixed debug keystore
# in .github/debug.keystore so every build shares one signature.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # gradle.properties carries the VM's egress-proxy settings; that host
      # does not exist on a GitHub runner, so strip them before building.
      - name: Remove VM-only proxy settings
        run: sed -i '/systemProp\..*\.proxy/d' gradle.properties

      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCam-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
